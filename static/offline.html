<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meneja360 offline</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
        }

        .offline-panel {
            max-width: 480px;
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 2rem;
        }

        .offline-logo {
            width: 72px;
            height: 72px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <main class="offline-panel">
        <img class="offline-logo" src="/static/img/cyberpoa-logo.svg" alt="Meneja360">
        <h1>You are offline</h1>
        <p>Meneja360 is installed, but this page needs a connection before it can load fresh business data.</p>
        <button class="btn" type="button" onclick="window.location.reload()">Try again</button>
    </main>
</body>
</html>
